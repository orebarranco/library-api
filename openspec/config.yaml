schema: spec-driven

context: |
  Project: library-api — REST API for library management
  Stack: PHP 8.4, Laravel 13, Sanctum 4, spatie/laravel-query-builder
  Architecture: Screaming/Hexagonal — Controllers→Actions→Models (App\Actions, App\DTOs, App\Enums)
  API: JSON:API responses, versioned under /api/v1/, RBAC (admin/librarian roles)
  PKs: ULIDs everywhere. strict_types=1 enforced, all classes final.
  Models: User, Author, Category (Books module pending — module 5)
  Auth: Sanctum tokens, email verification, password reset, role-based middleware

strict_tdd: true

testing:
  runner: pest
  version: "4"
  command: php artisan test --compact
  full_suite: composer test
  coverage:
    enabled: true
    threshold: 100
    command: "XDEBUG_MODE=coverage pest --parallel --coverage --exactly=100.0"
  type_coverage:
    enabled: true
    threshold: 100
    command: "pest --type-coverage --min=100"
  layers:
    unit: true
    feature: true
    e2e: false
  quality:
    linter: "vendor/bin/pint --parallel"
    type_checker: "vendor/bin/phpstan"
    formatter: "vendor/bin/pint --parallel --format agent"
    refactorer: "vendor/bin/rector"

rules:
  proposal:
    - Include rollback plan for risky DB changes
    - Verify no ULID/PK convention is broken
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - JSON:API response shape MUST be documented per endpoint
  design:
    - Include sequence diagrams for complex flows (Actions, DTOs, Resources)
    - Document architecture decisions with rationale
    - Follow App\Actions→App\DTOs→Eloquent layering
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Tests MUST be written before implementation (strict TDD)
  apply:
    - Follow existing code patterns (final classes, strict_types, ULIDs)
    - Run pint after every PHP file change
    tdd: true
    test_command: "php artisan test --compact"
    coverage_command: "XDEBUG_MODE=coverage pest --parallel --coverage --exactly=100.0"
  verify:
    test_command: "php artisan test --compact"
    build_command: "composer test"
    coverage_threshold: 100
  archive:
    - Warn before merging destructive deltas
    - Ensure main specs in openspec/specs/ are updated after archive
